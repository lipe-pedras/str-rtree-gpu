name: GPU Simulator

# Optional, non-required check. The hosted runners have no GPU, so this runs
# bench/test_correctness.sh on a simulated NVIDIA H100
# (https://github.com/pantheongpu/pantheonsim). A simulator has no timing
# model and cannot reproduce hardware-specific behavior, so it complements
# real-GPU testing and does not replace it.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/**"
      - "bench/test_correctness.sh"
      - "Makefile"
      - ".github/workflows/gpu-sim.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  correctness:
    name: Correctness (CUDA 13.0 and simulated H100)
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up the simulated GPU and CUDA toolkit
        uses: pantheongpu/setup-pantheonsim@a1b9d4237411f9b2b0e0bb895b4d83377f336a7b # v0.1.9
        with:
          gpu: nvidia/h100
          cuda-toolkit: "13.0"

      # The Makefile hardcodes -arch=sm_86. compute_90 embeds PTX only, which
      # the simulator runs, and it needs a shared CUDA runtime.
      - name: Build
        run: |
          make -j3 NVCCFLAGS="-O3 -std=c++17 -arch=compute_90 -cudart shared" \
            bin/str_rtree bin/str_rtree_cpu bin/rect_rtree_query bin/gen_rects

      # The script also hardcodes -arch=sm_86 for its reduced-budget loader
      # (the forced disk-spill case), so it runs from a copy with the same
      # flags as above. It runs with N=200000 instead of the default 1000000
      # to keep the simulated run short. The script exits non-zero on any
      # failed check; the greps also reject a run that printed nothing, and
      # every VERIFY OK / MATCH line must be there (6 verify checks, 4 query
      # equivalence checks).
      - name: Correctness tests (GPU vs CPU query results)
        shell: bash
        run: |
          set -o pipefail
          sed 's/-arch=sm_86/-arch=compute_90 -cudart shared/' bench/test_correctness.sh \
            > bench/test_correctness_ci.sh
          grep -q -e '-arch=compute_90 -cudart shared' bench/test_correctness_ci.sh
          vgpu run --preload bash bench/test_correctness_ci.sh 200000 | tee correctness.log
          grep -q "ALL CORRECTNESS TESTS PASSED" correctness.log
          test "$(grep -c 'VERIFY OK$' correctness.log)" = 6
          test "$(grep -c 'MATCH$' correctness.log)" -ge 4
          if grep -Eqi "VirtualGPU error|no device|MISMATCH|FAILED|skipped|CUDA error" correctness.log; then
            echo "::error::the simulated GPU run reported a problem"
            exit 1
          fi
